[package]
name = "spike-rdp-frame"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
iced = { version = "0.14", features = ["tokio", "image"] }
# The `ironrdp` meta crate (0.17) still pulls ironrdp-connector 0.10, whose crypto
# pins conflict with russh. The sub-crates are newer, so depend on them directly.
ironrdp-blocking = "0.12"
ironrdp-connector = "0.12"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
# `ring` keeps the build free of cmake and a C toolchain for aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
