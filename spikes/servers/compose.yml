# Test servers for the M0 spikes. Bound to localhost only.
services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: spike
      USER_PASSWORD: spike
      PASSWORD_ACCESS: "true"
    ports:
      - "127.0.0.1:2222:2222"
  rdp:
    # xrdp with an XFCE desktop. Login: abc / abc.
    image: lscr.io/linuxserver/rdesktop:ubuntu-xfce
    shm_size: 1gb
    ports:
      - "127.0.0.1:3389:3389"
