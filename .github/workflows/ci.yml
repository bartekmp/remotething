# Lint, format and unit tests for pushes to main and for pull requests.
# Jenkins runs the same `cargo xtask` commands plus the Windows build and packaging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The toolchain and its rustfmt and clippy come from rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      # Same versions as ci/Dockerfile.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3

      - name: Version raised when the crates changed
        if: github.event_name == 'pull_request'
        run: cargo xtask version-check "origin/${{ github.base_ref }}"

      - name: Format, clippy, dependency and licence checks
        run: cargo xtask lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.148

      - name: Unit tests
        run: cargo xtask test
