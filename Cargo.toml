[workspace]
resolver = "3"
members = ["crates/app", "crates/capture", "crates/core", "crates/files", "crates/rdp", "crates/remote", "crates/secrets", "crates/vnc", "xtask"]
# Throwaway M0 prototypes with their own lockfile.
exclude = ["spikes"]

[workspace.package]
version = "0.82.0"
edition = "2024"
publish = false
authors = ["bartekmp"]
license = "GPL-3.0-only"
repository = "https://github.com/bartekmp/remotething"
homepage = "https://github.com/bartekmp/remotething"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# Full debug info made each test binary ~700 MB, and every rebuild left another behind.
[profile.dev]
debug = "line-tables-only"

# A network client that parses what servers send: an overflow stops the program
# instead of wrapping around silently.
[profile.release]
overflow-checks = true
