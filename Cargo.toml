[workspace]
resolver = "3"
members = ["crates/app", "crates/core", "crates/files", "crates/remote", "crates/secrets", "xtask"]
# Throwaway M0 prototypes with their own lockfile.
exclude = ["spikes"]

[workspace.package]
version = "0.11.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
