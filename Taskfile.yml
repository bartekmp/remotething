# Shortcuts for everyday work. Needs Task: https://taskfile.dev
# `task` alone lists them. Jenkins runs the same steps through `cargo xtask`.
version: "3"

tasks:
  default:
    desc: List the tasks
    cmds:
      - task --list
    silent: true

  run:
    desc: Run the app (debug build). Extra arguments go after `--`, e.g. task run -- --config my.toml
    cmds:
      - cargo run -p remotething -- {{.CLI_ARGS}}

  build:
    desc: Build everything (debug)
    cmds:
      - cargo build --workspace

  build:release:
    desc: Build the Linux release binary
    cmds:
      - cargo xtask build linux

  build:windows:
    desc: Cross-build the Windows release binary (needs cargo-xwin)
    cmds:
      - cargo xtask build windows

  test:
    desc: Run all tests. Extra arguments filter, e.g. task test -- session
    cmds:
      - cargo nextest run --workspace {{.CLI_ARGS}}

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt --all

  lint:
    desc: Check formatting, clippy warnings, licences and advisories
    cmds:
      - cargo xtask lint

  check:
    desc: Everything a commit must pass (lint, then tests)
    cmds:
      - task: lint
      - task: test

  docs:
    desc: Build the user guide and open it in the browser (needs mdbook)
    cmds:
      - mdbook serve docs --open

  package:linux:
    desc: Build the .deb and .rpm into dist/ (needs cargo-deb and cargo-generate-rpm)
    cmds:
      - cargo xtask build linux
      - cargo xtask package linux

  package:windows:
    desc: Build the Windows zip into dist/
    cmds:
      - cargo xtask package windows

  bump:feature:
    desc: Raise the version for a new feature (0.2.0 becomes 0.3.0)
    cmds:
      - cargo xtask bump minor

  bump:fix:
    desc: Raise the version for a fix (0.2.0 becomes 0.2.1)
    cmds:
      - cargo xtask bump patch

  bump:breaking:
    desc: Raise the version for a change that breaks users' files or habits (0.2.0 becomes 1.0.0)
    cmds:
      - cargo xtask bump major

  clean:
    desc: Remove build output
    cmds:
      - cargo clean
      - rm -rf dist docs/book
