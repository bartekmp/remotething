[package]
name = "remotething"
description = "Remote desktops, terminals and file transfers in one tree."
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.deb]
maintainer = "bartekmp <remotething@lel.lu>"
copyright = "2026, bartekmp. Licensed under the GNU General Public License, version 3."
section = "net"
priority = "optional"
# `$auto` only sees linked libraries. The window toolkit loads these at run time.
depends = "$auto, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0"
# Without a GPU driver the app falls back to software rendering.
recommends = "libvulkan1 | libegl1"
extended-description = "Remote desktops (RDP, VNC), SSH terminals and file transfers, organised in one connection tree."
assets = [
    ["target/release/remotething", "usr/bin/", "755"],
    ["packaging/remotething.desktop", "usr/share/applications/", "644"],
    ["../../LICENSE", "usr/share/doc/remotething/LICENSE", "644"],
    ["packaging/remotething.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/remotething.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/icons/remotething-16.png", "usr/share/icons/hicolor/16x16/apps/remotething.png", "644"],
    ["packaging/icons/remotething-32.png", "usr/share/icons/hicolor/32x32/apps/remotething.png", "644"],
    ["packaging/icons/remotething-48.png", "usr/share/icons/hicolor/48x48/apps/remotething.png", "644"],
    ["packaging/icons/remotething-64.png", "usr/share/icons/hicolor/64x64/apps/remotething.png", "644"],
    ["packaging/icons/remotething-128.png", "usr/share/icons/hicolor/128x128/apps/remotething.png", "644"],
    ["packaging/icons/remotething-256.png", "usr/share/icons/hicolor/256x256/apps/remotething.png", "644"],
]

[package.metadata.generate-rpm]
license = "GPL-3.0-only"
url = "https://github.com/bartekmp/remotething"
summary = "Remote desktops, terminals and file transfers in one tree"
assets = [
    { source = "target/release/remotething", dest = "/usr/bin/remotething", mode = "755" },
    { source = "packaging/remotething.desktop", dest = "/usr/share/applications/remotething.desktop", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/remotething/LICENSE", mode = "644" },
    { source = "packaging/remotething.metainfo.xml", dest = "/usr/share/metainfo/remotething.metainfo.xml", mode = "644" },
    { source = "packaging/remotething.svg", dest = "/usr/share/icons/hicolor/scalable/apps/remotething.svg", mode = "644" },
    { source = "packaging/icons/remotething-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/remotething.png", mode = "644" },
    { source = "packaging/icons/remotething-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/remotething.png", mode = "644" },
    { source = "packaging/icons/remotething-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/remotething.png", mode = "644" },
    { source = "packaging/icons/remotething-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/remotething.png", mode = "644" },
    { source = "packaging/icons/remotething-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/remotething.png", mode = "644" },
    { source = "packaging/icons/remotething-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/remotething.png", mode = "644" },
]

# Loaded at run time by the window toolkit, so not found automatically.
[package.metadata.generate-rpm.requires]
libX11 = "*"
libX11-xcb = "*"
libXcursor = "*"
libXi = "*"
libXrandr = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"

[lints]
workspace = true

[dependencies]
anyhow = "1"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
# Decodes the pictures of the remote file preview; only the common formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
# `tokio`: sessions run on a tokio runtime. `canvas`: the terminal is drawn cell by cell.
iced = { version = "0.14", features = ["tokio", "canvas", "image-without-codecs"] }
# The terminal's grid and escape-sequence handling.
alacritty_terminal = "0.26"
# Reads the arguments and variables typed for a local shell the way a shell would.
shell-words = "1"
remotething-capture = { path = "../capture" }
remotething-files = { path = "../files" }
remotething-rdp = { path = "../rdp" }
remotething-vnc = { path = "../vnc" }
remotething-remote = { path = "../remote" }
# System file dialogs, through the desktop portal on Linux.
rfd = "0.18"
tokio = { version = "1", features = ["rt", "sync", "time"] }
remotething-core = { path = "../core" }
remotething-secrets = { path = "../secrets" }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
toml = "1"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"
png = "0.18"
