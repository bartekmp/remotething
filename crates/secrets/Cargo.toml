[package]
name = "remotething-secrets"
description = "Passwords and passphrases: an in-memory type that cannot leak, and the stores that keep them."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Encrypted-file store: Argon2id for the key, XChaCha20-Poly1305 for the data.
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
# The `v1` feature picks the platform store: Secret Service, Credential Manager or Keychain.
keyring = "4.2"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
