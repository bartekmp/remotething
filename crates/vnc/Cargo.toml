[package]
name = "remotething-vnc"
description = "VNC sessions over vnc-rs. Knows nothing about the UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
remotething-secrets = { path = "../secrets" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
vnc-rs = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
