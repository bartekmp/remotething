[package]
name = "remotething-files"
description = "Remote file systems for Remotething: listing folders and moving files."
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
remotething-remote = { path = "../remote" }
remotething-secrets = { path = "../secrets" }
# Lets the file systems be used as trait objects.
async-trait = "0.1"
# Fingerprints of FTPS certificates, which are pinned like SSH host keys.
sha2 = "0.11"
# The SMB protocol, version 2 and 3, in pure Rust.
smb2 = "0.43"
# The SFTP protocol, spoken over a channel of an SSH connection.
russh-sftp = "3"
# The FTP protocol, with explicit TLS (FTPS) through rustls.
suppaftp = { version = "13", default-features = false, features = ["tokio-rustls-ring"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
# The NFS protocol, version 3, in pure Rust.
nfs3_client = { version = "0.9", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
