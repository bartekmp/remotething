[package]
name = "remotething-remote"
description = "The protocols Remotething speaks. Each one sits behind a Cargo feature and knows nothing about the UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ssh"]
ssh = ["dep:russh", "dep:tokio"]

[dependencies]
remotething-secrets = { path = "../secrets" }
# `ring` instead of the default `aws-lc-rs` backend, which needs cmake.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"], optional = true }

[dev-dependencies]
# The tests run a small SSH server in-process.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
