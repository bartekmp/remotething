[package]
name = "remotething-rdp"
description = "Windows Remote Desktop sessions over IronRDP. Knows nothing about the UI."
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
remotething-secrets = { path = "../secrets" }
ironrdp-blocking = "0.12"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
# `ring` keeps the build free of cmake and a C toolchain for aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
ironrdp-cliprdr = "0.9"

[dev-dependencies]
tempfile = "3"
